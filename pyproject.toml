[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "djmaker"
version = "0.1.3"
description = "Кроссплатформенный менеджер музыкальной библиотеки для Windows и macOS"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet==0.86.5",
    "flet-audio==0.86.5",
    "flet-dropzone==0.4.0",
    "mutagen==1.48.1",
    "librosa>=0.10,<0.11",
    "onnxruntime-directml>=1.17,<2; sys_platform == 'win32'",
    "onnxruntime>=1.17,<2; sys_platform != 'win32'",
]

[project.optional-dependencies]
desktop-build = [
    "flet-cli==0.86.5",
]

[project.scripts]
djmaker = "djmaker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
djmaker = ["py.typed"]

[tool.flet.app]
path = "src"
module = "main.py"
[tool.flet.flutter.pubspec.dependency_overrides]
flet = "0.86.5"

# Энергия трека считается через librosa, а он не работает в бандле serious_python
# с настройками по умолчанию — нужны ОБА следующих параметра:
#
# 1) compile.packages: numba (зависимость librosa) использует @jit(cache=True) и
#    требует реальный .py рядом с модулем. По умолчанию пакеты компилируются в .pyc,
#    а исходники удаляются -> «cannot cache function ... no locator available».
# 2) cleanup.packages: чистка удаляет все *.pyi, а librosa читает __init__.pyi при
#    импорте (lazy_loader.attach_stub) -> «Cannot load imports from non-existent
#    stub ...__init__.pyi».
[tool.flet.compile]
packages = false

[tool.flet.cleanup]
packages = false

[tool.flet.boot_screen.flet]
theme_mode = "auto"

